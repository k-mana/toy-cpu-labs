<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>命令セット・ラボ</title>
<link rel="stylesheet" href="../shared/lab.css">
<!--
  新しいラボのひな形を兼ねたページです。このフォルダをコピーして始めてください。
  構成: index.html (見た目) / app.js (動き) / lessons.js (教材データ)
  詳しくは docs/extending.md「新しいラボを作る」。
-->
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --sunk:#eceef2; --line:#d6dae1; --ink:#161b24; --muted:#5d6676; --accent:#2a5bd7; --bad:#c2372b; --ok:#22804a;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#171b23; --sunk:#11151c; --line:#2a303b; --ink:#e3e7ee; --muted:#939cab; --accent:#7ea2ff; --bad:#ff7a6b; --ok:#5ccf8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#171b23; --sunk:#11151c; --line:#2a303b; --ink:#e3e7ee; --muted:#939cab; --accent:#7ea2ff; --bad:#ff7a6b; --ok:#5ccf8a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);padding:0 16px}
.wrap{max-width:1200px;margin:0 auto;padding:20px 0 48px}
h1{font-size:24px;margin:0 0 4px}
.lede{margin:0 0 16px;color:var(--muted);max-width:70ch}
.labnav{color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.panel h2{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;font-weight:600}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
textarea{width:100%;min-height:300px;font:13px/1.55 var(--mono);background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px;resize:vertical;tab-size:8}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
.err{color:var(--bad);font:12.5px/1.5 var(--mono);white-space:pre-wrap;margin:8px 0 0}
.status{font:13px var(--mono);color:var(--muted)}
.status.bad{color:var(--bad)} .status.ok{color:var(--ok)}
.regs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.reg{background:var(--sunk);border-radius:3px;padding:4px 6px;font-family:var(--mono)}
.reg span{display:block;font-size:10px;color:var(--muted)}
.reg b{font-weight:600;font-variant-numeric:tabular-nums}
.reg.chg{outline:2px solid var(--accent);outline-offset:-2px}
table{border-collapse:collapse;width:100%;font:12px/1.5 var(--mono)}
th,td{text-align:left;padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-family:var(--sans);font-size:11px}
tr.cur td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.scroll{overflow:auto;max-height:420px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono)}
.memhead{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}
.memhead input{font:12px var(--mono);width:8em;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
</style>
</head>
<body>
<div class="wrap">
  <nav class="labnav" aria-label="サイト内"><a href="../../">← 仮想CPU ラボ</a><a href="../../reference/">命令セット一覧</a><a href="../../docs/">ドキュメント</a></nav>
  <h1>命令セット・ラボ</h1>
  <p class="lede">TOY 命令セットのプログラムを書いて、アセンブル結果（機械語）、1命令ずつの実行、レジスタとメモリ、5段パイプラインでのサイクル数を確かめる場所です。新しいラボを作るときのひな形でもあります。</p>

  <div class="grid">
    <div class="col">
      <section class="panel">
        <h2>プログラム</h2>
        <div class="row" style="margin:0 0 8px"><label for="example">プログラム</label><select id="example"></select></div>
        <textarea id="src" spellcheck="false" aria-label="アセンブリ"></textarea>
        <div class="row">
          <button class="btn primary" id="bAsm">アセンブルして最初から</button>
          <button class="btn" id="bStep">1命令</button>
          <button class="btn" id="bRun">最後まで</button>
          <span class="status" id="status"></span>
        </div>
        <p class="err" id="err" hidden></p>
      </section>
      <section class="panel">
        <h2>5段パイプラインで流すと</h2>
        <dl class="kv" id="pipe"></dl>
      </section>
    </div>
    <div class="col">
      <section class="panel">
        <h2>レジスタ</h2>
        <div class="regs" id="regs"></div>
      </section>
      <section class="panel">
        <h2>機械語</h2>
        <div class="scroll"><table id="listing"></table></div>
      </section>
      <section class="panel">
        <h2>データメモリ</h2>
        <div class="memhead"><label for="memFrom">先頭番地</label><input id="memFrom" value="0x0"> <span>から 64 ワード</span></div>
        <div class="scroll"><table id="mem"></table></div>
      </section>
    </div>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
