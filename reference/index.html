<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOY 命令セット一覧</title>
<style>
:root{
  --bg:#f6f6f3; --panel:#fff; --sunk:#efefea; --line:#dcdcd4; --ink:#1a1a17; --muted:#626257; --accent:#1f5fbf;
  --I:#1f5fbf; --M:#8a4fc4; --A:#c0522d; --X:#2f7d4f;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; --sans:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121311; --panel:#1a1b18; --sunk:#151613; --line:#2e2f2a; --ink:#e8e8e2; --muted:#9d9d92; --accent:#86aef5;
  --I:#86aef5; --M:#c39bf0; --A:#f09878; --X:#7fd3a2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121311; --panel:#1a1b18; --sunk:#151613; --line:#2e2f2a; --ink:#e8e8e2; --muted:#9d9d92; --accent:#86aef5;
  --I:#86aef5; --M:#c39bf0; --A:#f09878; --X:#7fd3a2; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:0 16px;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans)}
.wrap{max-width:1100px;margin:0 auto;padding:28px 0 64px}
nav{font-size:12px;display:flex;gap:18px;margin-bottom:14px}
nav a{color:var(--muted);text-decoration:none} nav a:hover{text-decoration:underline}
h1{font-size:28px;margin:0 0 6px;line-height:1.3}
h2{font-size:20px;margin:36px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 .chip{font:600 12px var(--mono);padding:1px 8px;border-radius:3px;color:var(--panel);background:var(--c)}
h3{font-size:15px;margin:22px 0 6px}
p{margin:0 0 10px;max-width:72ch}
.lede{color:var(--muted)}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.92em}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500;background:var(--sunk);white-space:nowrap}
td.mn{font:600 13px var(--mono);white-space:nowrap}
td.op,td.hex{font-family:var(--mono);white-space:nowrap}
td.sum{font-family:var(--mono);font-size:12.5px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border:1px solid var(--line);border-radius:3px;color:var(--muted);margin:0 4px 2px 0;white-space:nowrap}
.fmt{font:12px/1.4 var(--mono);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.bits{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;min-width:520px}
.bits span{padding:4px 6px;border-right:1px solid var(--line);text-align:center;background:var(--panel)}
.bits span:last-child{border-right:0}
.bits .o{background:var(--sunk)}
.decode{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.decode input{font:14px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);color:var(--ink);width:14em}
.decode output{font:600 14px var(--mono)}
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:13px}
.regs div{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.regs b{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <nav aria-label="サイト内"><a href="../">← 仮想CPU ラボ</a><a href="../docs/">ドキュメント</a><a href="../labs/playground/">命令セット・ラボ</a></nav>
  <h1>TOY 命令セット一覧</h1>
  <p class="lede">この表は、シミュレータが実際に使っている命令定義 (<code>core/ext/*.js</code>) からページを開くたびに作られます。正式な説明は<a href="../docs/#isa">命令セット仕様</a>を見てください。</p>

  <h2>レジスタとメモリ</h2>
  <div class="regs">
    <div><b>r0</b> 常に 0。書いても捨てられる</div>
    <div><b>r1〜r14</b> 汎用</div>
    <div><b>r15</b> 汎用 (CALL/RET の戻り先に使う慣習)</div>
    <div><b>PC</b> 命令の番号 (0, 1, 2, …)</div>
    <div><b>データメモリ</b> バイト番地・リトルエンディアン。ワードは4の倍数の番地</div>
  </div>

  <h2>命令形式</h2>
  <div class="tbl" style="padding:12px 14px"><div class="fmt" id="formats"></div></div>

  <h2>機械語を読む</h2>
  <div class="decode"><label for="word">32ビットの機械語</label><input id="word" value="0x01123000" spellcheck="false"><span>→</span><output id="dis"></output></div>

  <div id="exts"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
