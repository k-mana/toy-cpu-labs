<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOY ドキュメント</title>
<style>
:root{
  --bg:#f7f7f4; --panel:#fff; --sunk:#efefea; --line:#dcdcd4; --ink:#1b1b18; --muted:#62625a; --accent:#1f5fbf; --code:#f1f1ec;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK JP",monospace; --sans:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121311; --panel:#1a1b18; --sunk:#151613; --line:#2f302b; --ink:#e8e8e2; --muted:#9e9e94; --accent:#8ab0f5; --code:#202119; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121311; --panel:#1a1b18; --sunk:#151613; --line:#2f302b; --ink:#e8e8e2; --muted:#9e9e94; --accent:#8ab0f5; --code:#202119; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.85 var(--sans)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:32px;padding:0 16px}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr);gap:0}}
aside{position:sticky;top:0;align-self:start;padding:28px 0;max-height:100vh;overflow:auto}
@media (max-width:820px){aside{position:static;padding:16px 0 0;max-height:none}}
aside .home{font-size:12px;color:var(--muted);text-decoration:none;display:block;margin-bottom:14px}
aside .home:hover{text-decoration:underline}
aside h1{font-size:15px;margin:0 0 10px}
aside nav{display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){aside nav{flex-direction:row;flex-wrap:wrap;gap:4px 6px}}
aside nav a{color:var(--ink);text-decoration:none;padding:5px 10px;border-radius:4px;font-size:14px;border:1px solid transparent}
aside nav a:hover{background:var(--sunk)}
aside nav a[aria-current="page"]{background:var(--panel);border-color:var(--line);font-weight:600}
aside nav .sep{height:1px;background:var(--line);margin:8px 0}
@media (max-width:820px){aside nav .sep{display:none}}
aside .ext{margin-top:16px;font-size:13px;display:flex;flex-direction:column;gap:4px}
aside .ext a{color:var(--accent)}
main{padding:28px 0 80px;min-width:0}
article{max-width:78ch}
article h1{font-size:28px;line-height:1.35;margin:0 0 16px}
article h2{font-size:21px;margin:44px 0 12px;padding-top:12px;border-top:1px solid var(--line)}
article h3{font-size:17px;margin:30px 0 8px}
article h4{font-size:15.5px;margin:24px 0 6px}
article p{margin:0 0 14px}
article a{color:var(--accent)}
article ul,article ol{margin:0 0 14px;padding-left:1.4em}
article li{margin:3px 0}
article li > p{margin:0 0 6px}
article code{font-family:var(--mono);font-size:.88em;background:var(--code);padding:1px 5px;border-radius:3px}
article pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;margin:0 0 16px;line-height:1.55}
article pre code{background:none;padding:0;font-size:13px}
article blockquote{margin:0 0 14px;padding:8px 14px;border-left:3px solid var(--accent);background:var(--panel);color:var(--muted)}
article blockquote p:last-child{margin:0}
article hr{border:0;border-top:1px solid var(--line);margin:32px 0}
article .tbl{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
article table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
article th,article td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
article tr:last-child td{border-bottom:0}
article th{background:var(--sunk);font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
article details{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;margin:0 0 16px}
article summary{cursor:pointer;color:var(--accent)}
article input[type=checkbox]{margin-right:6px}
.err{color:#c0392b}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <a class="home" href="../">← 仮想CPU ラボ</a>
    <h1>TOY ドキュメント</h1>
    <nav id="nav" aria-label="文書"></nav>
    <div class="ext"><a href="../reference/">命令セット一覧 →</a><a href="../labs/playground/">命令セット・ラボ →</a></div>
  </aside>
  <main><article id="doc" aria-live="polite"></article></main>
</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
